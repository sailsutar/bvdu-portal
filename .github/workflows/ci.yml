name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Build
        run: npm run build
        env:
          CI: true

  backend:
    name: Backend check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: starter/backend/package-lock.json
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Syntax check
        run: node --check server.js
      - name: Module parse (year-cohort)
        run: node --check src/year-cohort.js

  ml-service:
    name: ML service import
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core deps
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic numpy pandas scikit-learn joblib
          # shap/lightgbm optional for CI speed; install if present in requirements
          pip install shap lightgbm openpyxl || true
      - name: Import year-lock related modules
        run: |
          python -c "import ast; ast.parse(open('serve.py').read()); print('serve.py OK')"
          python -c "import ast; ast.parse(open('placement_tade_features.py').read()); print('tade features OK')" 2>/dev/null || echo "tade features optional"
